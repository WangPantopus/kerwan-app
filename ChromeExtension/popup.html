<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kerwan</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: #1e1e1e;
      color: #e0e0e0;
      width: 260px;
      min-height: 160px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid #2d2d2d;
    }

    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #555;
      flex-shrink: 0;
    }
    .dot.connected    { background: #34c759; }
    .dot.disconnected { background: #ff3b30; }

    .status-label {
      font-size: 11px;
      color: #999;
      margin-left: auto;
    }

    .section {
      padding: 10px 14px;
      border-bottom: 1px solid #2d2d2d;
    }

    .section:last-child { border-bottom: none; }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .label {
      font-size: 12px;
      color: #ccc;
    }

    /* Toggle switch */
    .toggle-wrap {
      position: relative;
      width: 36px;
      height: 20px;
    }

    .toggle-wrap input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .slider {
      position: absolute;
      inset: 0;
      background: #444;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: "";
      position: absolute;
      left: 2px;
      top: 2px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.2s;
    }

    .toggle-wrap input:checked + .slider { background: #007aff; }
    .toggle-wrap input:checked + .slider::before { transform: translateX(16px); }

    .footer {
      padding: 8px 14px;
      font-size: 11px;
      color: #666;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="dot" id="statusDot"></div>
    <h1>Kerwan</h1>
    <span class="status-label" id="statusLabel">Connecting…</span>
  </div>

  <div class="section">
    <div class="row">
      <span class="label">Capture enabled</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="captureToggle" />
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="footer" id="footerMsg">
    Kerwan captures LinkedIn profiles and Gmail threads.
  </div>

  <script src="popup.js"></script>
</body>
</html>
